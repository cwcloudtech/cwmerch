# __API_ORIGIN__ and __API_PATH__ (the public CWMERCH_API_URL split into origin
# and base path) and __RESOLVER__ (from /etc/resolv.conf) are filled in by
# docker-entrypoint.sh at container start: no other environment variable.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # The API's public name is resolved per request (not at start), so nginx
    # starts even when the API isn't reachable yet.
    resolver __RESOLVER__ valid=30s ipv6=off;
    set $cwmerch_api "__API_ORIGIN__";

    # The raw SPA shell: what the browser falls back to, and what the API's
    # SEO renderer fetches (CWMERCH_UI_URL/index.html). Never proxied.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SEO: storefront pages, loaded from the API's public SEO renderer
    # (GET /v1/seo/html: index.html with the page's <head>) and served under
    # the UI's own address. Plain SPA shell if the API is down or errors.
    location = / {
        rewrite ^ __API_PATH__/v1/seo/html?path=$uri break;
        include /etc/nginx/conf.d/seo-proxy.inc;
    }
    location @seo {
        rewrite ^ __API_PATH__/v1/seo/html?path=$uri break;
        include /etc/nginx/conf.d/seo-proxy.inc;
    }
    location = /sitemap.xml {
        rewrite ^ __API_PATH__/sitemap.xml break;
        include /etc/nginx/conf.d/seo-proxy.inc;
    }
    location = /robots.txt {
        rewrite ^ __API_PATH__/robots.txt break;
        include /etc/nginx/conf.d/seo-proxy.inc;
    }

    # App routes (never storefront pages): plain SPA shell.
    location ~ ^/(admin|cart|checkout|contact|my-account|forgot-password|reset-password|oidc|assistant)(/|$) {
        try_files $uri /index.html;
    }

    # A static file, or a storefront page (SEO above).
    location / {
        try_files $uri @seo;
    }
}
