# ${CWMERCH_API_INTERNAL_URL} is substituted by docker-entrypoint.sh at
# container start (default http://api:8080).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Runtime config: regenerated at container start, never cached.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The raw SPA template (also what the API's SEO renderer fetches).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite emits content-hashed file names under /assets: cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SEO: storefront pages are rendered by the API (index.html with the
    # <head> filled for the route). Their addresses follow WooCommerce's
    # permalinks (/product/…, /produit/…, /boutique, %product_cat%…), so every
    # path that is not a file nor an app route goes through the API, which
    # resolves it. Falls back to the plain SPA shell if the API is down or
    # answers an error.
    location = / {
        rewrite ^ /v1/seo/html?path=$uri break;
        include /etc/nginx/conf.d/seo-proxy.inc;
    }
    location @seo {
        rewrite ^ /v1/seo/html?path=$uri break;
        include /etc/nginx/conf.d/seo-proxy.inc;
    }
    # App routes (never storefront pages): plain SPA shell.
    location ~ ^/(admin|cart|checkout|contact|my-account|forgot-password|reset-password|oidc|assistant)(/|$) {
        try_files $uri /index.html;
    }

    location = /sitemap.xml {
        proxy_pass ${CWMERCH_API_INTERNAL_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /robots.txt {
        proxy_pass ${CWMERCH_API_INTERNAL_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else: a static file, or a storefront page (SEO above).
    location / {
        try_files $uri @seo;
    }
}
