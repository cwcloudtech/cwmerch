# cwmerch, fresh install: the database (MySQL or PostgreSQL), the Flyway
# migrations, the API and the UI.
#
#   cp .env.example .env   # then edit the secrets
#   docker compose up -d --build
#
# MySQL is the default. PostgreSQL (new projects): set DB_TYPE=postgres and
# COMPOSE_PROFILES=postgres in .env (the `postgres` service replaces `db`).
#
# The UI is on http://localhost:3000, the API (Swagger UI at /) on
# http://localhost:8080. The first account registered becomes the shop's
# administrator.
#
# Alongside an EXISTING WordPress/WooCommerce (MySQL/MariaDB): set
# COMPOSE_PROFILES= (no database service), point DB_* at the WordPress
# database, set DB_TABLE_PREFIX, and initialise Flyway's history first
# (cwmerch-db/README.md). API only (AI agent for WooCommerce, no shop UI):
# CWMERCH_API_ONLY=true and `docker compose up -d flyway api`.
services:
  db:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-${MYSQL_DATABASE:-wordpress}}
      MYSQL_USER: ${DB_USER:-${MYSQL_USER:-wordpress}}
      MYSQL_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-wordpress}}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${DB_NAME:-wordpress}
      POSTGRES_USER: ${DB_USER:-wordpress}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PUBLISH_PORT:-5432}:5432"
    networks:
      default:
        aliases: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wordpress} -d ${DB_NAME:-wordpress}"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10-alpine
    depends_on:
      db:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      DB_TYPE: ${DB_TYPE:-mysql}
      DB_HOST: ${DB_HOST:-${MYSQL_HOST:-db}}
      DB_PORT: ${DB_PORT:-${MYSQL_PORT:-}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-wordpress}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-wordpress}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-wordpress}}
      DB_TABLE_PREFIX: ${DB_TABLE_PREFIX:-${WP_TABLE_PREFIX:-wp_}}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    volumes:
      - ./cwmerch-db:/flyway/sql:ro
      - ./.docker/flyway/migrate.sh:/migrate.sh:ro

  api:
    build:
      context: .
      target: api
    image: ${REGISTRY:-registry.cwcloud.tech}/cwmerch-api:${VERSION:-latest}
    depends_on:
      flyway:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST:-${MYSQL_HOST:-db}}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/uploads
    tmpfs:
      - /storage:size=128m,uid=10001

  ui:
    build:
      context: .
      target: ui
    image: ${REGISTRY:-registry.cwcloud.tech}/cwmerch-ui:${VERSION:-latest}
    depends_on:
      - api
    environment:
      CWMERCH_API_URL: ${CWMERCH_API_URL:-http://localhost:8080}
      CWMERCH_API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:80"

volumes:
  db-data:
  pg-data:
  uploads:
