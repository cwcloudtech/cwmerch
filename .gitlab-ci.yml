stages:
  - publish
  - build

mirror:
  stage: publish
  script:
    - setsid ./ci/mirror.sh
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^main$/
  tags:
    - mirror

build:
  stage: build
  tags:
    - imagesbuilder
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^main$/
      changes:
        - ci/**/*
        - cwmerch-api/**/*
        - cwmerch-ui/**/*
        - cwmerch-db/**/*
        - .docker/**/*
        - Dockerfile
        - docker-compose*.yml
        - VERSION
  script:
    - setsid ./ci/prune.sh
    - setsid ./ci/deliver.sh
